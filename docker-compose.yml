services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_practice
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=practice_db
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: python_app
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    volumes:
      - .:/app

volumes:
  mongo_data:
